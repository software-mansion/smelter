[package]
name = "smelter-api"
version = "0.6.0"
edition = "2024"
license-file = "../LICENSE"

[features]
default = []
decklink = ["smelter-core/decklink"]
web-renderer = ["smelter-core/web-renderer"]
gpu-video = ["smelter-core/gpu-video", "dep:gpu-video"]

[dependencies]
smelter-render = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
utoipa = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
itertools = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smelter-core = { workspace = true }
ffmpeg-next = { workspace = true }
rtmp = { workspace = true }
gpu-video = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
