name: Rust - check
on:
    workflow_dispatch: {}
    push:
        branches: [master]
    pull_request:
        types: [opened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    build_and_lint_linux:
        if: false # TEMP: disabled while testing the windows job
        runs-on: ubuntu-24.04
        steps:
            - name: 🛠 Install system dependencies
              run: |
                  set -e
                  sudo apt-get update -y -qq
                  sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libopus-dev
                  sudo apt-get clean
                  sudo rm -rf /var/lib/apt/lists/*

            - name: "Increase disk space"
              run: |
                  df -h && docker system prune -a -f && sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup && df -h

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98
                  components: rustfmt, clippy

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "linux-build"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🪢 Generate Chromium Embedded Framework bindings
              run: cargo build --package libcef

            - name: 🛠 Cargo build
              run: |
                  cargo build --features decklink
                  cargo build --no-default-features

            - name: 📖 Check formatting
              run: cargo fmt --all --check

            - name: 📎 Run clippy (all-features)
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            - name: 📎 Run clippy (no-default-features)
              run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

            - name: 📎 Run clippy (gpu-video, no-default-features)
              run: cargo clippy --package gpu-video --all-targets --no-default-features -- -D clippy::todo -D clippy::uninlined_format_args -D warnings

            - name: 📚 Check rustdoc
              run: cargo doc --workspace --lib --exclude integration-tests --exclude tools --no-deps --all-features --document-private-items
              env:
                  RUSTDOCFLAGS: -D warnings -A rustdoc::bare_urls

            - name: 📄 Generate JSON schema
              run: |
                  cargo run -p tools --bin generate_from_types -- --check

    build_macos:
        if: false # TEMP: disabled while testing the windows job
        runs-on: macos-15
        steps:
            - name: 🛠 Install system dependencies
              run: brew install ffmpeg

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98
                  components: rustfmt, clippy

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "macos-build"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🪢 Generate Chromium Embedded Framework bindings
              run: cargo build --package libcef

            - name: 📖 Check formatting
              run: cargo fmt --all --check

            - name: 📎 Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: 📎 Run clippy (no-default-features)
              run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

            - name: 📎 Run clippy (gpu-video, no-default-features)
              run: cargo clippy --package gpu-video --all-targets --no-default-features -- -D clippy::todo -D clippy::uninlined_format_args -D warnings

    test_macos:
        if: false # TEMP: disabled while testing the windows job
        needs: build_macos
        runs-on: macos-15
        steps:
            - name: 🛠 Install system dependencies
              run: brew install ffmpeg

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96

            - name: 🔬 Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "macos-build"

            - name: 🧪 Run gpu-video tests
              run: |
                  cargo nextest run --package gpu-video --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'

    test_linux:
        if: false # TEMP: disabled while testing the windows job
        needs: build_and_lint_linux
        runs-on: gpu-gh-hosted-runner
        steps:
            - name: 🛠 Install system dependencies
              run: |
                  set -e
                  sudo apt-get update -y -qq
                  sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libopus-dev pkg-config libssl-dev libclang-dev
                  sudo apt-get clean
                  sudo rm -rf /var/lib/apt/lists/*

            - name: "Increase disk space"
              run: |
                  df -h && docker system prune -a -f && sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup && df -h

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98

            - name: 🔬 Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "linux-test"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🧪 Run unit tests
              run: |
                  cargo nextest run --workspace --profile ci -E 'not test(/^pipeline_tests::/) and not test(/^render_tests::/) and not binary_id(gpu-video::gpu_video_tests)'

            - name: 🧪 Run render tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^render_tests::/)'

            - name: 🧪 Run gpu-video tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'

            - name: 🧪 Run pipeline tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^pipeline_tests::/) and not test(/_flaky$/)'

            - name: 🧪 Run flaky pipeline tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^pipeline_tests::/) and test(/_flaky$/)'

            - name: 📦 Upload failed snapshot test artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test_workdir
                  path: integration-tests/test_workdir
                  retention-days: 2

            - name: 📚 Run doctests
              run: cargo test --workspace --doc
# run only when gpu-video code was touched
    test_windows:
        # needs: build_and_lint_linux
        runs-on: windows-gpu-2022
        steps:
            # The runner image ships the T4 with an old Tesla driver in TCC mode, which exposes no
            # Vulkan device. Microsoft's Azure-licensed GRID driver runs the card in WDDM and is recent
            # enough for Vulkan Video. See learn.microsoft.com/azure/virtual-machines/windows/n-series-driver-setup
            - name: 🛠 Install Azure GRID driver (T4 boots in TCC, Vulkan needs WDDM)
              shell: powershell
              run: |
                  $ErrorActionPreference = "Stop"
                  $model = (nvidia-smi --query-gpu=driver_model.current --format=csv,noheader) -join ""
                  if ($model -match "TCC") {
                      $exe = "$env:RUNNER_TEMP\grid.exe"
                      curl.exe -fsSL -o $exe "https://download.microsoft.com/download/0f21fd13-2390-4c79-876a-87ae3dc724c6/596.86_grid_win10_win11_server2022_server2025_dch_64bit_international_azure_swl.exe"
                      if ($LASTEXITCODE -ne 0) { throw "download failed" }
                      Write-Host "downloaded $((Get-Item $exe).Length) bytes"
                      $p = Start-Process -FilePath $exe -ArgumentList "-s", "-noreboot", "-clean", "-noeula" -Wait -PassThru
                      Write-Host "installer exit code: $($p.ExitCode)"
                      Start-Sleep -Seconds 15
                  }
                  nvidia-smi --query-gpu=driver_version,driver_model.current,driver_model.pending --format=csv

            # `shell: bash` steps (also used internally by the rust-toolchain and install-action
            # actions) must resolve to Git Bash, not the WSL launcher in System32.
            - name: 🛠 Put Git Bash on PATH
              shell: powershell
              run: |
                  $gitBin = Join-Path (Split-Path (Split-Path (Get-Command git).Source)) "bin"
                  $gitBin | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: 🛠 Install LLVM (libclang for bindgen)
              uses: KyleMayes/install-llvm-action@v2
              with:
                  version: "20.1.8"

            - name: 🛠 Install FFmpeg
              shell: powershell
              run: |
                  $ErrorActionPreference = "Stop"
                  $tag = "autobuild-2026-11-05-12-48"
                  $archive = "ffmpeg-n8.1.3-34-ga35157abb9-win64-gpl-shared-8.1.zip"
                  Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/$tag/$archive" -OutFile "$env:RUNNER_TEMP\$archive"
                  Expand-Archive -Path "$env:RUNNER_TEMP\$archive" -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
                  $ffmpegDir = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName
                  "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "$ffmpegDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Show `FFmpeg` version
              run: ffmpeg -version

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98

            - name: 🔬 Install nextest
              shell: bash
              run: |
                  curl -LsSf https://get.nexte.st/latest/windows-tar | tar zxf - -C "$(cygpath -u "${CARGO_HOME:-$USERPROFILE/.cargo}")/bin"
                  cargo nextest --version

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              shell: bash
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "windows-test"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🔍 GPU diagnostics
              continue-on-error: true
              env:
                  LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
              run: |
                  nvidia-smi
                  cargo run -p gpu-video --example print_hw_capabilities

            - name: 🧪 Run gpu-video tests
              env:
                  LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
              run: |
                  cargo nextest run --package gpu-video --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'
