name: Rust - check
on:
    workflow_dispatch: {}
    push:
        branches: [master]
    pull_request:
        types: [opened, synchronize]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    build_and_lint_linux:
        runs-on: ubuntu-24.04
        steps:
            - name: 🛠 Install system dependencies
              run: |
                  set -e
                  sudo apt-get update -y -qq
                  sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libopus-dev
                  sudo apt-get clean
                  sudo rm -rf /var/lib/apt/lists/*

            - name: "Increase disk space"
              run: |
                  df -h && docker system prune -a -f && sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup && df -h

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98
                  components: rustfmt, clippy

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "linux-build"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🪢 Generate Chromium Embedded Framework bindings
              run: cargo build --package libcef

            - name: 🛠 Cargo build
              run: |
                  cargo build --features decklink
                  cargo build --no-default-features

            - name: 📖 Check formatting
              run: cargo fmt --all --check

            - name: 📎 Run clippy (all-features)
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings

            - name: 📎 Run clippy (no-default-features)
              run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

            - name: 📎 Run clippy (gpu-video, no-default-features)
              run: cargo clippy --package gpu-video --all-targets --no-default-features -- -D clippy::todo -D clippy::uninlined_format_args -D warnings

            - name: 📚 Check rustdoc
              run: cargo doc --workspace --lib --exclude integration-tests --exclude tools --no-deps --all-features --document-private-items
              env:
                  RUSTDOCFLAGS: -D warnings -A rustdoc::bare_urls

            - name: 📄 Generate JSON schema
              run: |
                  cargo run -p tools --bin generate_from_types -- --check

    build_macos:
        runs-on: macos-15
        steps:
            - name: 🛠 Install system dependencies
              run: brew install ffmpeg

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98
                  components: rustfmt, clippy

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "macos-build"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🪢 Generate Chromium Embedded Framework bindings
              run: cargo build --package libcef

            - name: 📖 Check formatting
              run: cargo fmt --all --check

            - name: 📎 Run clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: 📎 Run clippy (no-default-features)
              run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

            - name: 📎 Run clippy (gpu-video, no-default-features)
              run: cargo clippy --package gpu-video --all-targets --no-default-features -- -D clippy::todo -D clippy::uninlined_format_args -D warnings

    test_macos:
        needs: build_macos
        runs-on: macos-15
        steps:
            - name: 🛠 Install system dependencies
              run: brew install ffmpeg

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.96

            - name: 🔬 Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "macos-build"

            - name: 🧪 Run gpu-video tests
              run: |
                  cargo nextest run --package gpu-video --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'

    test_linux:
        needs: build_and_lint_linux
        runs-on: gpu-gh-hosted-runner
        steps:
            - name: 🛠 Install system dependencies
              run: |
                  set -e
                  sudo apt-get update -y -qq
                  sudo apt-get install -y mesa-vulkan-drivers libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev ffmpeg libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev libopus-dev pkg-config libssl-dev libclang-dev
                  sudo apt-get clean
                  sudo rm -rf /var/lib/apt/lists/*

            - name: "Increase disk space"
              run: |
                  df -h && docker system prune -a -f && sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup && df -h

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98

            - name: 🔬 Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "linux-test"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🧪 Run unit tests
              run: |
                  cargo nextest run --workspace --profile ci -E 'not test(/^pipeline_tests::/) and not test(/^render_tests::/) and not binary_id(gpu-video::gpu_video_tests)'

            - name: 🧪 Run render tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^render_tests::/)'

            - name: 🧪 Run gpu-video tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'

            - name: 🧪 Run pipeline tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^pipeline_tests::/) and not test(/_flaky$/)'

            - name: 🧪 Run flaky pipeline tests
              if: ${{ !cancelled() }}
              run: |
                  cargo nextest run --workspace --profile ci -E 'test(/^pipeline_tests::/) and test(/_flaky$/)'

            - name: 📦 Upload failed snapshot test artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test_workdir
                  path: integration-tests/test_workdir
                  retention-days: 2

            - name: 📚 Run doctests
              run: cargo test --workspace --doc
# run only when gpu-video code was touched
    test_windows:
        # needs: build_and_lint_linux
        runs-on: windows-gpu-2022
        steps:
            - name: 🛠 Install LLVM (libclang for bindgen)
              shell: powershell
              run: |
                  $ErrorActionPreference = "Stop"
                  $version = "20.1.8"
                  $dir = "$env:RUNNER_TOOL_CACHE\llvm\$version"
                  if (-not (Test-Path "$dir\bin\libclang.dll")) {
                      New-Item -ItemType Directory -Force -Path $dir | Out-Null
                      $archive = "clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
                      Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$archive" -OutFile "$env:RUNNER_TEMP\$archive"
                      tar -xf "$env:RUNNER_TEMP\$archive" -C $dir --strip-components=1
                  }
                  "LIBCLANG_PATH=$dir\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

            - name: 🛠 Install FFmpeg
              shell: powershell
              run: |
                  $ErrorActionPreference = "Stop"
                  $version = "7.1"
                  $dir = "$env:RUNNER_TOOL_CACHE\ffmpeg\$version"
                  if (-not (Test-Path "$dir\bin\ffmpeg.exe")) {
                      New-Item -ItemType Directory -Force -Path $dir | Out-Null
                      $archive = "ffmpeg-n$version-latest-win64-gpl-shared-$version.zip"
                      Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$archive" -OutFile "$env:RUNNER_TEMP\$archive"
                      tar -xf "$env:RUNNER_TEMP\$archive" -C $dir --strip-components=1
                  }
                  "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
                  "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

            - name: Show `FFmpeg` version
              run: ffmpeg -version

            - name: 🔧 Install the rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: 1.98

            - name: 🔬 Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: 📥 Checkout repo
              uses: actions/checkout@v6

            - name: 🧩 Git submodules update
              shell: bash
              run: |
                  cat > .gitmodules << EOF
                  [submodule "snapshots"]
                          path = integration-tests/snapshots
                          url = https://github.com/smelter-labs/smelter-snapshot-tests.git
                  EOF
                  git submodule update --init

            - name: 📁 Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  shared-key: "windows-test"
                  save-if: ${{ github.ref == 'refs/heads/master' }}

            - name: 🧪 Run gpu-video tests
              run: |
                  cargo nextest run --package gpu-video --profile ci -E 'binary_id(gpu-video::gpu_video_tests)'
