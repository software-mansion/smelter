[package]
name = "smelter-render"
version = "0.6.0"
edition = "2024"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
web-renderer = ["dep:libcef", "dep:shared_memory", "dep:nalgebra-glm", "dep:rand"]

[dependencies]
pollster = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
libcef = { workspace = true, optional = true }
image = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
bytemuck = { version = "1.13.1", features = ["derive"] }
glyphon = { workspace = true }
crossbeam-channel = { workspace = true }
resvg = "0.35.0"
nalgebra-glm = { version = "0.18.0", features = ["convert-bytemuck"], optional = true }
naga = { workspace = true }
rand = { workspace = true, optional = true }
tracing = { workspace = true }
shared_memory = { workspace = true, optional = true }
sys-locale = "0.3.1"

[lints]
workspace = true
